# Start small, since grouped CV runs one full model fit per candidate per fold.
- n_voxels: 2048
  brain_pcs: 32
  shape_pcs: 16
  ridge_alpha: 10.0
  mask_side: 8
  feature_mode: mean
  seed: 42
- n_voxels: 4096
  brain_pcs: 64
  shape_pcs: 32
  ridge_alpha: 100.0
  mask_side: 8
  feature_mode: mean
  seed: 42
- n_voxels: 4096
  brain_pcs: 64
  shape_pcs: 32
  ridge_alpha: 1000.0
  mask_side: 8
  feature_mode: mean_delta
  seed: 42
# Retain temporal changes without truncating them to high-variance brain PCs.
- n_voxels: 31141
  brain_pcs: 0
  shape_pcs: 32
  ridge_alpha: 100000.0
  mask_side: 8
  feature_mode: delta
  retrieval_metric: euclidean
  seed: 42
- n_voxels: 31141
  brain_pcs: 0
  shape_pcs: 32
  ridge_alpha: 100000.0
  mask_side: 8
  feature_mode: delta
  retrieval_metric: cosine
  seed: 42
- n_voxels: 31141
  brain_pcs: 0
  shape_pcs: 32
  ridge_alpha: 1000.0
  mask_side: 8
  feature_mode: delta
  retrieval_metric: cosine
  seed: 42
